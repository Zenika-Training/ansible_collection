---
# Skipped for compact: compact.yml already ran `create manifests` itself.
- name: Cilium - generate manifests
  ansible.builtin.command:
    cmd: "/usr/local/bin/openshift-install --dir={{ oc_coreos_work_dir }}/{{ oc_coreos_ocp_name }} create manifests"
  changed_when: true
  when: oc_coreos_topology == 'sno'

- name: Cilium - validate manifests archive file path is set
  ansible.builtin.assert:
    that: oc_coreos_cilium_manifests_file | length > 0
    fail_msg: "oc_coreos_cilium_manifests_file must be set (download the CLiFE archive manually, see README)"

- name: Cilium - check manifests archive file exists
  ansible.builtin.stat:
    path: "{{ oc_coreos_cilium_manifests_file }}"
  register: _oc_coreos_cilium_manifests_stat

- name: Cilium - assert manifests archive file exists
  ansible.builtin.assert:
    that: _oc_coreos_cilium_manifests_stat.stat.exists
    fail_msg: "Cilium manifests archive file not found: {{ oc_coreos_cilium_manifests_file }}"

- name: Cilium - extract manifests archive into ignition directory
  ansible.builtin.unarchive:
    src: "{{ oc_coreos_cilium_manifests_file }}"
    dest: "{{ oc_coreos_work_dir }}/{{ oc_coreos_ocp_name }}/manifests/"
    remote_src: true
    extra_opts:
      - --strip-components=1
      # The CLiFE archive bundles its own copy of the dns-default-all-egress NetworkPolicy as a
      # Day-1 manifest. Applying it at Day-1 deadlocks bootstrap-in-place (openshift-dns does not
      # exist yet). Excluded here and extracted separately below, to be applied post-install
      # instead (see oc_coreos_cilium_dns_default_all_egress_workaround / wait_install.yml).
      - --exclude=networkpolicy-dns.yaml

- name: Cilium - extract dns-default-all-egress NetworkPolicy for post-install application
  ansible.builtin.unarchive:
    src: "{{ oc_coreos_cilium_manifests_file }}"
    dest: "{{ oc_coreos_work_dir }}/{{ oc_coreos_ocp_name }}/"
    remote_src: true
    extra_opts:
      - --strip-components=1
      # The archive stores entries with a "./" prefix (e.g. "./networkpolicy-dns.yaml"); tar
      # requires an exact member-name match for positional extraction, unlike the looser
      # --exclude match above.
      - ./networkpolicy-dns.yaml

- name: Cilium - validate registry credentials file path is set
  ansible.builtin.assert:
    that: oc_coreos_cilium_registry_creds_file | length > 0
    fail_msg: "oc_coreos_cilium_registry_creds_file must be set (see README: build a .dockerconfigjson for containers.isovalent.com)"

- name: Cilium - check registry credentials file exists
  ansible.builtin.stat:
    path: "{{ oc_coreos_cilium_registry_creds_file }}"
  register: _oc_coreos_cilium_registry_creds_stat

- name: Cilium - assert registry credentials file exists
  ansible.builtin.assert:
    that: _oc_coreos_cilium_registry_creds_stat.stat.exists
    fail_msg: "Cilium registry credentials file not found: {{ oc_coreos_cilium_registry_creds_file }}"

# clife-controller-manager's ServiceAccount (shipped in the archive) references
# imagePullSecrets: [cilium-registry-creds] by this exact name, and must pull its own image from
# this static Day-1 Secret before it can run - a CRD-managed RegistryCredential, which only
# clife-controller-manager itself can reconcile, cannot be the sole source of this secret.
- name: Cilium - write cilium-registry-creds Secret manifest
  ansible.builtin.copy:
    content: >-
      {{ {
           'apiVersion': 'v1',
           'kind': 'Secret',
           'metadata': {'name': 'cilium-registry-creds', 'namespace': 'cilium'},
           'type': 'kubernetes.io/dockerconfigjson',
           'data': {
             '.dockerconfigjson': lookup('file', oc_coreos_cilium_registry_creds_file) | b64encode
           }
         } | to_nice_yaml(indent=2) }}
    dest: "{{ oc_coreos_work_dir }}/{{ oc_coreos_ocp_name }}/manifests/v1_secret_cilium-registry-creds.yaml"
    mode: "0600"

- name: Cilium - read cluster-network-02-config.yml
  ansible.builtin.slurp:
    src: "{{ oc_coreos_work_dir }}/{{ oc_coreos_ocp_name }}/manifests/cluster-network-02-config.yml"
  register: _oc_coreos_cn02_raw

- name: "Cilium - patch cluster-network-02-config.yml (deployKubeProxy: false)"
  ansible.builtin.copy:
    content: "{{ _oc_coreos_cn02_raw.content | b64decode | from_yaml | combine({'spec': {'deployKubeProxy': false}}, recursive=True) | to_nice_yaml(indent=2) }}"
    dest: "{{ oc_coreos_work_dir }}/{{ oc_coreos_ocp_name }}/manifests/cluster-network-02-config.yml"
    mode: "0644"

- name: Cilium - read clife controller Deployment
  ansible.builtin.slurp:
    src: "{{ oc_coreos_work_dir }}/{{ oc_coreos_ocp_name }}/manifests/apps_v1_deployment_clife-controller-manager.yaml"
  register: _oc_coreos_clife_deploy_raw

- name: Cilium - patch clife controller Deployment (KUBERNETES_SERVICE_HOST/PORT)
  vars:
    _oc_coreos_deploy: "{{ _oc_coreos_clife_deploy_raw.content | b64decode | from_yaml }}"
    _oc_coreos_container: "{{ _oc_coreos_deploy.spec.template.spec.containers[0] }}"
    _oc_coreos_env_patch:
      - name: KUBERNETES_SERVICE_HOST
        value: "api-int.{{ oc_coreos_ocp_name }}.{{ oc_coreos_ocp_domain }}"
      - name: KUBERNETES_SERVICE_PORT
        value: "6443"
  ansible.builtin.copy:
    content: >-
      {{ _oc_coreos_deploy | combine({
           'spec': {
             'template': {
               'spec': {
                 'containers': [
                   _oc_coreos_container | combine({'env': _oc_coreos_container.env + _oc_coreos_env_patch})
                 ]
               }
             }
           }
         }, recursive=True) | to_nice_yaml(indent=2) }}
    dest: "{{ oc_coreos_work_dir }}/{{ oc_coreos_ocp_name }}/manifests/apps_v1_deployment_clife-controller-manager.yaml"
    mode: "0644"

- name: Cilium - read subscription.yaml
  ansible.builtin.slurp:
    src: "{{ oc_coreos_work_dir }}/{{ oc_coreos_ocp_name }}/manifests/subscription.yaml"
  register: _oc_coreos_subscription_raw

- name: Cilium - patch subscription.yaml (KUBERNETES_SERVICE_HOST/PORT)
  ansible.builtin.copy:
    content: >-
      {{ _oc_coreos_subscription_raw.content | b64decode | from_yaml | combine({
           'spec': {
             'config': {
               'env': [
                 {'name': 'KUBERNETES_SERVICE_HOST',
                  'value': 'api-int.' + oc_coreos_ocp_name + '.' + oc_coreos_ocp_domain},
                 {'name': 'KUBERNETES_SERVICE_PORT', 'value': '6443'}
               ]
             }
           }
         }, recursive=True) | to_nice_yaml(indent=2) }}
    dest: "{{ oc_coreos_work_dir }}/{{ oc_coreos_ocp_name }}/manifests/subscription.yaml"
    mode: "0644"

- name: Cilium - read CiliumConfig manifest
  ansible.builtin.slurp:
    src: "{{ oc_coreos_work_dir }}/{{ oc_coreos_ocp_name }}/manifests/ciliumconfig.yaml"
  register: _oc_coreos_cilium_config_raw

# Standard Helm chart value: without imagePullSecrets here, the rendered cilium/cilium-operator/
# cilium-envoy pods have no pull secret at all and stay in ImagePullBackOff, even with a valid
# cilium-registry-creds Secret. See oc_coreos_cilium_registry_creds_file for how that secret is
# built.
- name: Cilium - patch CiliumConfig
  ansible.builtin.copy:
    content: >-
      {{ _oc_coreos_cilium_config_raw.content | b64decode | from_yaml
         | combine({
             'spec': {
               'kubeProxyReplacement': true,
               'k8sServiceHost': 'api-int.' + oc_coreos_ocp_name + '.' + oc_coreos_ocp_domain,
               'k8sServicePort': 6443,
               'ipam': {
                 'operator': {
                   'clusterPoolIPv4PodCIDRList': [oc_coreos_cluster_network_cidr]
                 }
               },
               'cni': {
                 'exclusive': oc_coreos_cilium_cni_exclusive
               },
               'bpf': {
                 'masquerade': oc_coreos_cilium_bpf_masquerade,
                 'hostLegacyRouting': oc_coreos_cilium_bpf_host_legacy_routing
               },
               'imagePullSecrets': [{'name': 'cilium-registry-creds'}]
             }
           }, recursive=True)
         | combine(
             {'spec': {'socketLB': {'hostNamespaceOnly': true}}}
             if oc_coreos_cilium_socket_lb_host_namespace_only else {},
             recursive=True
           )
         | to_nice_yaml(indent=2) }}
    dest: "{{ oc_coreos_work_dir }}/{{ oc_coreos_ocp_name }}/manifests/ciliumconfig.yaml"
    mode: "0644"

# The dns-default-all-egress NetworkPolicy workaround is applied post-install (wait_install.yml),
# not here: bootkube.service applies every manifests/*.yaml file as one atomic batch during the
# first-boot bootstrap-in-place phase and retries forever if any of them fails - it never
# progresses to render the release payload that creates the openshift-dns namespace in the first
# place. Shipping this NetworkPolicy as a Day-1 manifest deadlocks the bootstrap: the node never
# shuts down to reboot from disk.
