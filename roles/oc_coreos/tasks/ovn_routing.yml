---
# Day-1 : spec.defaultNetwork.ovnKubernetesConfig.gatewayConfig.routingViaHost (see
# oc_coreos_ovn_routing_via_host). Patches the Network Day-1 manifest generated by
# `create manifests` before ignition is produced, so the cluster boots with the right value
# instead of needing the live Day-2 patch used on clusters installed before this task existed
# (ensure_routing_via_host() in training-openshift/scripts/mesh-shared-ca-setup.sh).
#
# Skipped for compact: compact.yml already ran `create manifests` itself, before this include.
- name: OVN routing - generate manifests
  ansible.builtin.command:
    cmd: "/usr/local/bin/openshift-install --dir={{ oc_coreos_work_dir }}/{{ oc_coreos_ocp_name }} create manifests"
  changed_when: true
  when: oc_coreos_topology == 'sno'

- name: OVN routing - read generated Network Day-1 manifest
  ansible.builtin.slurp:
    src: "{{ oc_coreos_work_dir }}/{{ oc_coreos_ocp_name }}/manifests/cluster-network-03-config.yml"
  register: _oc_coreos_ovn_network_manifest_raw

# combine(recursive=true) merges only the listed keys - preserves every installer-generated field
# (clusterNetwork, serviceNetwork, genevePort, etc.) instead of overwriting the whole manifest.
- name: OVN routing - patch routingViaHost into the Network Day-1 manifest
  vars:
    _oc_coreos_ovn_network_manifest: "{{ _oc_coreos_ovn_network_manifest_raw.content | b64decode | from_yaml }}"
  ansible.builtin.copy:
    dest: "{{ oc_coreos_work_dir }}/{{ oc_coreos_ocp_name }}/manifests/cluster-network-03-config.yml"
    mode: "0644"
    content: >-
      {{ _oc_coreos_ovn_network_manifest
         | combine({'spec': {'defaultNetwork': {'ovnKubernetesConfig': {'gatewayConfig': {'routingViaHost': oc_coreos_ovn_routing_via_host}}}}}, recursive=true)
         | to_nice_yaml(indent=2) }}
