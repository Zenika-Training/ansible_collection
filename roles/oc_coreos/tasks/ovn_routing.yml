---
# Day-1 advanced network config (Red Hat docs, "Specifying advanced network configuration"):
# spec.defaultNetwork.ovnKubernetesConfig.gatewayConfig.routingViaHost (see
# oc_coreos_ovn_routing_via_host). This manifest is NOT produced by `create manifests` itself -
# 🧪 confirmed on ocp1, 2026-11-13: `create manifests` writes no file with ovnKubernetesConfig
# anywhere under manifests/ or openshift/, only the unrelated cluster-network-02-config.yml
# (config.openshift.io/v1 Network, no defaultNetwork field). Per the documented procedure, this
# file has to be authored from scratch and dropped into manifests/ before ignition is produced -
# an earlier version of this task wrongly assumed an installer-generated file to read and patch.
# Writing it here instead of the live Day-2 patch used on clusters installed before this task
# existed (ensure_routing_via_host() in training-openshift/scripts/mesh-shared-ca-setup.sh) avoids
# the live rollout of ovnkube-node (brief per-node network outage) that the same change causes when
# patched Day-2 on an already-installed cluster.
#
# Skipped for compact: compact.yml already ran `create manifests` itself, before this include.
- name: OVN routing - generate manifests
  ansible.builtin.command:
    cmd: "/usr/local/bin/openshift-install --dir={{ oc_coreos_work_dir }}/{{ oc_coreos_ocp_name }} create manifests"
  changed_when: true
  when: oc_coreos_topology == 'sno'

- name: OVN routing - write Day-1 advanced network config manifest
  vars:
    _oc_coreos_ovn_network_manifest:
      apiVersion: operator.openshift.io/v1
      kind: Network
      metadata:
        name: cluster
      spec:
        clusterNetwork:
          - cidr: "{{ oc_coreos_cluster_network_cidr }}"
            hostPrefix: "{{ oc_coreos_cluster_network_prefix }}"
        serviceNetwork:
          - "{{ oc_coreos_service_network }}"
        defaultNetwork:
          type: OVNKubernetes
          ovnKubernetesConfig:
            gatewayConfig:
              routingViaHost: "{{ oc_coreos_ovn_routing_via_host }}"
  ansible.builtin.copy:
    dest: "{{ oc_coreos_work_dir }}/{{ oc_coreos_ocp_name }}/manifests/cluster-network-03-config.yml"
    mode: "0644"
    content: "{{ _oc_coreos_ovn_network_manifest | to_nice_yaml(indent=2) }}"
