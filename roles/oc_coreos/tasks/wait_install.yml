---
# The DNS/apiserver egress bug workaround must be applied here, once the real (second-boot)
# cluster is reachable, not as a Day-1 manifest (see cilium.yml): openshift-dns is created by the
# DNS operator once the control plane renders the release payload, which happens only after
# bootkube's own manifest batch (including any Day-1 extras) has fully succeeded. Applying it
# through a normal Kubernetes client here tolerates "not found yet" by retrying, unlike bootkube's
# all-or-nothing apply loop. The NetworkPolicy itself is CLiFE's own file, extracted (not applied)
# by cilium.yml, so it always matches the archive's content instead of a hand-copied duplicate.
- name: "Cilium - wait for openshift-dns namespace and apply DNS/apiserver egress workaround"
  when: oc_coreos_ocp_network == 'Cilium' and oc_coreos_cilium_dns_default_all_egress_workaround
  delegate_to: "{{ oc_coreos_controller_host }}"
  block:
    - name: Wait for the openshift-dns namespace to exist
      kubernetes.core.k8s_info:
        kubeconfig: "{{ oc_coreos_work_dir }}/{{ oc_coreos_ocp_name }}/auth/kubeconfig"
        api_version: v1
        kind: Namespace
        name: openshift-dns
      register: _oc_coreos_dns_ns
      until: _oc_coreos_dns_ns.resources is defined and _oc_coreos_dns_ns.resources | length > 0
      retries: "{{ oc_coreos_cilium_dns_workaround_retries }}"
      delay: "{{ oc_coreos_cilium_dns_workaround_delay }}"

    - name: Apply the dns-default-all-egress NetworkPolicy
      kubernetes.core.k8s:
        kubeconfig: "{{ oc_coreos_work_dir }}/{{ oc_coreos_ocp_name }}/auth/kubeconfig"
        state: present
        src: "{{ oc_coreos_work_dir }}/{{ oc_coreos_ocp_name }}/networkpolicy-dns.yaml"

- name: Wait for SNO installation to complete
  ansible.builtin.command:
    cmd: >-
      /usr/local/bin/openshift-install
      --dir={{ oc_coreos_work_dir }}/{{ oc_coreos_ocp_name }}
      wait-for install-complete
  delegate_to: "{{ oc_coreos_controller_host }}"
  changed_when: false
  register: _oc_coreos_wait_result
  retries: "{{ oc_coreos_install_retries }}"
  delay: 30
  until: _oc_coreos_wait_result.rc == 0
