---
- name: Create working directory
  ansible.builtin.file:
    path: "{{ oc_coreos_work_dir }}"
    state: directory
    mode: "0755"

# No single node IP in compact (4 VMs behind an external LB, see pre_tasks.yml):
# only check the names resolve, not that they point to a fixed address.
- name: Check DNS records
  ansible.builtin.assert:
    that: lookup('community.general.dig', item.query) not in ['', 'NXDOMAIN']
    fail_msg: "Missing DNS record: {{ item.label }}"
  loop:
    - query: "api.{{ oc_coreos_ocp_name }}.{{ oc_coreos_ocp_domain }}"
      label: "api.{{ oc_coreos_ocp_name }}.{{ oc_coreos_ocp_domain }}"
    - query: "api-int.{{ oc_coreos_ocp_name }}.{{ oc_coreos_ocp_domain }}"
      label: "api-int.{{ oc_coreos_ocp_name }}.{{ oc_coreos_ocp_domain }}"
    - query: "random.apps.{{ oc_coreos_ocp_name }}.{{ oc_coreos_ocp_domain }}"
      label: "*.apps.{{ oc_coreos_ocp_name }}.{{ oc_coreos_ocp_domain }}"
  loop_control:
    label: "{{ item.label }}"

- name: Get RHCOS stream JSON
  ansible.builtin.command:
    cmd: /usr/local/bin/openshift-install coreos print-stream-json
  register: _oc_coreos_stream_json
  changed_when: false

- name: Set RHCOS ISO URL from stream JSON
  ansible.builtin.set_fact:
    _oc_coreos_iso_url: >-
      {{ (_oc_coreos_stream_json.stdout | from_json)
         .architectures[oc_coreos_arch].artifacts.metal.formats.iso.disk.location }}

- name: Download RHCOS live ISO
  ansible.builtin.get_url:
    url: "{{ _oc_coreos_iso_url }}"
    dest: "{{ oc_coreos_work_dir }}/rhcos-live.iso"
    mode: "0644"

- name: Generate install-config.yaml
  ansible.builtin.template:
    src: install-config-compact.yaml.j2
    dest: "{{ oc_coreos_work_dir }}/install-config.yaml"
    mode: "0600"

- name: Clean ignition config directory
  ansible.builtin.file:
    path: "{{ oc_coreos_work_dir }}/{{ oc_coreos_ocp_name }}"
    state: absent

- name: Create ignition config directory
  ansible.builtin.file:
    path: "{{ oc_coreos_work_dir }}/{{ oc_coreos_ocp_name }}"
    state: directory
    mode: "0755"

- name: Copy install-config.yaml into ignition directory
  ansible.builtin.copy:
    src: "{{ oc_coreos_work_dir }}/install-config.yaml"
    dest: "{{ oc_coreos_work_dir }}/{{ oc_coreos_ocp_name }}/install-config.yaml"
    mode: "0600"
    remote_src: true

# Needed here (unlike SNO): manifests must exist before cilium.yml's patches.
# openshift-install already sets mastersSchedulable: true when compute.replicas
# is 0 (its own log confirms it) - no manual patch needed.
- name: Generate manifests
  ansible.builtin.command:
    cmd: "/usr/local/bin/openshift-install --dir={{ oc_coreos_work_dir }}/{{ oc_coreos_ocp_name }} create manifests"
  changed_when: true

- name: Cilium
  ansible.builtin.include_tasks: cilium.yml
  when: oc_coreos_ocp_network == 'Cilium'

- name: Generate ignition configs (bootstrap, master)
  ansible.builtin.command:
    cmd: "/usr/local/bin/openshift-install --dir={{ oc_coreos_work_dir }}/{{ oc_coreos_ocp_name }} create ignition-configs"
  changed_when: true

- name: Pull coreos-installer image
  containers.podman.podman_image:
    name: quay.io/coreos/coreos-installer:release
    force: true

# Removes any previously embedded ignition before re-encoding.
# Idempotent: exits with code 0 if the ISO has no embedded ignition.
- name: Remove existing ignition from ISO
  containers.podman.podman_container:
    name: coreos-installer-reset
    image: quay.io/coreos/coreos-installer:release
    state: started
    detach: false
    rm: true
    privileged: true
    volumes:
      - /dev:/dev
      - /run/udev:/run/udev
      - "{{ oc_coreos_work_dir }}:/data"
    workdir: /data
    command: "iso ignition remove rhcos-live.iso"
  changed_when: false

# coreos-installer's -o refuses to overwrite an existing file, even with
# --force - remove leftover ISOs first so this step stays replayable.
- name: Remove previous bootstrap/master ISOs
  ansible.builtin.file:
    path: "{{ oc_coreos_work_dir }}/{{ item }}"
    state: absent
  loop:
    - rhcos-bootstrap.iso
    - rhcos-master.iso

# Two ISO variants from the same clean base (-o leaves rhcos-live.iso untouched):
# rhcos-bootstrap.iso for the bootstrap VM, rhcos-master.iso reused for all masters.
#
# `iso customize --dest-device` (not `iso ignition embed`) is mandatory: embed
# only loads the ignition, with no install-to-disk trigger - the VM then boots
# live (squashfs, read-only) forever. --dest-device adds the self-install unit
# that writes RHCOS to disk and reboots. SNO doesn't need this: its ignition
# (`create single-node-ignition-config`) already bakes the trigger in.
- name: Embed bootstrap ignition into a dedicated ISO
  containers.podman.podman_container:
    name: coreos-installer-bootstrap
    image: quay.io/coreos/coreos-installer:release
    state: started
    detach: false
    rm: true
    privileged: true
    volumes:
      - /dev:/dev
      - /run/udev:/run/udev
      - "{{ oc_coreos_work_dir }}:/data"
    workdir: /data
    command: >-
      iso customize
      --dest-ignition {{ oc_coreos_ocp_name }}/bootstrap.ign
      --dest-device {{ oc_coreos_install_disk }}
      -o rhcos-bootstrap.iso rhcos-live.iso
  changed_when: true

- name: Embed master ignition into a dedicated ISO
  containers.podman.podman_container:
    name: coreos-installer-master
    image: quay.io/coreos/coreos-installer:release
    state: started
    detach: false
    rm: true
    privileged: true
    volumes:
      - /dev:/dev
      - /run/udev:/run/udev
      - "{{ oc_coreos_work_dir }}:/data"
    workdir: /data
    command: >-
      iso customize
      --dest-ignition {{ oc_coreos_ocp_name }}/master.ign
      --dest-device {{ oc_coreos_install_disk }}
      -o rhcos-master.iso rhcos-live.iso
  changed_when: true

- name: Post-tasks
  ansible.builtin.include_tasks: post_tasks_compact.yml
