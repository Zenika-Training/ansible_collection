---
- name: Pre-checks
  ansible.builtin.include_tasks: pre_tasks.yml

- name: Single Node OpenShift (SNO)
  ansible.builtin.include_tasks: sno.yml
  when: oc_coreos_topology == 'sno'

- name: Compact (3 control-plane, 0 compute) cluster
  ansible.builtin.include_tasks: compact.yml
  when: oc_coreos_topology == 'compact'
