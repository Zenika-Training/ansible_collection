---
# Shared kubeconfig resolution logic for all OCP roles.
#
# Input  var: _kube_path  — the role-specific kubeconfig variable value
# Output fact: _ocp_kubeconfig_resolved — empty string (use ambient context) or valid path
#
# Usage in a role's auth.yml:
#   - ansible.builtin.include_role:
#       name: zenika.training.ocp_utils
#       tasks_from: resolve_kubeconfig.yml
#     vars:
#       _kube_path: "{{ my_role_kubeconfig }}"
#   - ansible.builtin.set_fact:
#       my_role_kubeconfig: "{{ _ocp_kubeconfig_resolved }}"

- name: Check kubeconfig file existence
  ansible.builtin.stat:
    path: "{{ _kube_path }}"
  register: _ocp_resolve_kubeconfig_stat
  when: _kube_path | length > 0

- name: Clear kubeconfig when file is absent
  ansible.builtin.set_fact:
    _ocp_kubeconfig_resolved: ""
  when: not (_ocp_resolve_kubeconfig_stat.stat.exists | default(false))

- name: Set kubeconfig to provided path when file exists
  ansible.builtin.set_fact:
    _ocp_kubeconfig_resolved: "{{ _kube_path }}"
  when: _ocp_resolve_kubeconfig_stat.stat.exists | default(false)

- name: Check default kube context existence
  ansible.builtin.stat:
    path: "~/.kube/config"
  register: _ocp_resolve_default_kube_stat
  when: _ocp_kubeconfig_resolved | length == 0

- name: Assert that a kube context is available
  ansible.builtin.assert:
    that: _ocp_kubeconfig_resolved | length > 0 or _ocp_resolve_default_kube_stat.stat.exists | default(false)
    fail_msg: >-
      No kubeconfig found at '{{ _kube_path }}' and ~/.kube/config does not exist.
      Run `oc login <api-url>` first, or set the role kubeconfig variable to a valid path.
