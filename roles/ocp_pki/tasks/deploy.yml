---
# cert-manager uses the namespace cert-manager (--cluster-resource-namespace default)
# to look up secrets referenced by ClusterIssuers. Pre-creating the namespace here
# is idempotent with the cert-manager operator installation performed later in the course.
- name: Ensure cert-manager namespace exists
  kubernetes.core.k8s:
    kubeconfig: "{{ ocp_pki_kubeconfig | default(omit, true) }}"
    validate_certs: "{{ ocp_pki_validate_certs }}"
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: cert-manager

- name: Deploy pki-issuer-ca secret in cert-manager namespace
  kubernetes.core.k8s:
    kubeconfig: "{{ ocp_pki_kubeconfig | default(omit, true) }}"
    validate_certs: "{{ ocp_pki_validate_certs }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: pki-issuer-ca
        namespace: cert-manager
      type: kubernetes.io/tls
      data:
        tls.crt: "{{ _ocp_pki_ca_cert.content }}"
        tls.key: "{{ _ocp_pki_ca_key.content }}"
        # ca.crt = Root CA cert uniquement.
        # cert-manager propage ce champ dans istio-ca.ca.crt → istio-csr le distribue
        # comme trust anchor via istio-ca-root-cert (même fingerprint sur tous les clusters).
        # La chaîne istiod-tls.tls.crt est complète via tls.crt : istiod-tls → istio-ca
        # → ocp3 Intermediate CA (depuis pki-issuer-ca.tls.crt) → Root CA (trust anchor).
        ca.crt: "{{ _ocp_pki_root_cert.content }}"
  no_log: true
