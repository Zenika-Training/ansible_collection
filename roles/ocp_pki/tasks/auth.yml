---
- name: Resolve kubeconfig path
  ansible.builtin.include_role:
    name: zenika.training.ocp_utils
    tasks_from: resolve_kubeconfig.yml
  vars:
    _kube_path: "{{ ocp_pki_kubeconfig }}"

- name: Apply resolved kubeconfig
  ansible.builtin.set_fact:
    ocp_pki_kubeconfig: "{{ _ocp_kubeconfig_resolved }}"
