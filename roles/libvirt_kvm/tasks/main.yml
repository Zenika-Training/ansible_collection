---
- name: Pre-checks
  ansible.builtin.include_tasks: pre_tasks.yml

- name: Copy RHCOS ISO to KVM host
  become: true
  ansible.builtin.copy:
    src: "{{ libvirt_kvm_iso_src }}"
    dest: "{{ libvirt_kvm_iso_dest_dir }}/rhcos-{{ libvirt_kvm_name }}-live.iso"
    mode: "0644"
    remote_src: "{{ libvirt_kvm_iso_host == libvirt_kvm_target_host }}"
  delegate_to: "{{ libvirt_kvm_target_host }}"

- name: Create LVM volume for VM disk
  become: true
  community.general.lvol:
    vg: "{{ libvirt_kvm_vg_pool }}"
    lv: "vm_{{ libvirt_kvm_name }}"
    size: "{{ libvirt_kvm_disk_size }}"
    state: present
  delegate_to: "{{ libvirt_kvm_target_host }}"

- name: Create LVM volumes for additional disks
  become: true
  community.general.lvol:
    vg: "{{ libvirt_kvm_vg_pool }}"
    lv: "vm_{{ libvirt_kvm_name }}_{{ item.name }}"
    size: "{{ item.size }}"
    state: present
  loop: "{{ libvirt_kvm_extra_disks }}"
  loop_control:
    label: "{{ item.name }}"
  delegate_to: "{{ libvirt_kvm_target_host }}"

# virt_install only takes effect at initial domain creation - this computed list is what a fresh
# deployment gets, not something that can hot-attach a disk to an already-running VM. Adding
# libvirt_kvm_extra_disks to an existing host's host_vars documents the target state for its next
# rebuild; attaching a disk to a live VM remains a manual virt-manager/virsh operation.
- name: Compute full disk list (OS disk + additional disks)
  ansible.builtin.set_fact:
    _libvirt_kvm_disks: >-
      {%- set disks = [{
        'path': '/dev/' ~ libvirt_kvm_vg_pool ~ '/vm_' ~ libvirt_kvm_name,
        'bus': 'virtio', 'format': 'raw', 'cache': libvirt_kvm_disk_cache,
        'driver': {'io': libvirt_kvm_disk_io}
      }] -%}
      {%- for d in libvirt_kvm_extra_disks -%}
        {%- set _ = disks.append({
          'path': '/dev/' ~ libvirt_kvm_vg_pool ~ '/vm_' ~ libvirt_kvm_name ~ '_' ~ d.name,
          'bus': 'virtio', 'format': 'raw', 'cache': libvirt_kvm_disk_cache,
          'driver': {'io': libvirt_kvm_disk_io}
        }) -%}
      {%- endfor -%}
      {{ disks }}

- name: Define extra libvirt networks (dedicated NIC, e.g. inter-cluster link)
  become: true
  community.libvirt.virt_net:
    command: define
    name: "{{ item.name }}"
    xml: "{{ lookup('template', 'extra_network.xml.j2') }}"
  loop: "{{ libvirt_kvm_extra_networks }}"
  loop_control:
    label: "{{ item.name }}"
  delegate_to: "{{ libvirt_kvm_target_host }}"

- name: Ensure extra libvirt networks are active and autostart
  become: true
  community.libvirt.virt_net:
    name: "{{ item.name }}"
    state: active
    autostart: true
  loop: "{{ libvirt_kvm_extra_networks }}"
  loop_control:
    label: "{{ item.name }}"
  delegate_to: "{{ libvirt_kvm_target_host }}"

# Same constraint as _libvirt_kvm_disks above: only takes effect for a VM created after this runs.
- name: Compute full network list (primary bridge + additional dedicated networks)
  ansible.builtin.set_fact:
    _libvirt_kvm_networks: >-
      {%- set nets = [{
        'bridge': libvirt_kvm_bridge,
        'model': {'type': 'virtio'}, 'mac': {'address': libvirt_kvm_mac}
      }] -%}
      {%- for n in libvirt_kvm_extra_networks -%}
        {%- set _ = nets.append({
          'network': n.name,
          'model': {'type': 'virtio'}, 'mac': {'address': n.mac}
        }) -%}
      {%- endfor -%}
      {{ nets }}

- name: Create KVM virtual machine
  become: true
  community.libvirt.virt_install:
    name: "{{ libvirt_kvm_name }}"
    osinfo:
      name: "{{ libvirt_kvm_osinfo }}"
    disks: "{{ _libvirt_kvm_disks }}"
    cdrom: "{{ libvirt_kvm_iso_dest_dir }}/rhcos-{{ libvirt_kvm_name }}-live.iso"
    memory: "{{ libvirt_kvm_memory }}"
    vcpus: "{{ libvirt_kvm_vcpus }}"
    cpu:
      model: "{{ libvirt_kvm_cpu_model }}"
    autostart: true
    graphics:
      type: "{{ libvirt_kvm_graphics_type }}"
      listen: "{{ libvirt_kvm_graphics_listen }}"
    networks: "{{ _libvirt_kvm_networks }}"
  delegate_to: "{{ libvirt_kvm_target_host }}"
  register: _libvirt_kvm_install

# Both SNO (bootstrap-in-place) and compact (`iso customize --dest-device`)
# install to disk and power off - an explicit restart is needed either way.
- name: Wait for first-boot installation to complete (VM shuts off) # noqa: no-handler
  become: true
  community.libvirt.virt:
    command: status
    name: "{{ libvirt_kvm_name }}"
  until: _libvirt_kvm_domstate.status == 'shutdown'
  register: _libvirt_kvm_domstate
  retries: "{{ libvirt_kvm_first_boot_retries }}"
  delay: "{{ libvirt_kvm_first_boot_delay }}"
  delegate_to: "{{ libvirt_kvm_target_host }}"
  when: _libvirt_kvm_install.changed

- name: Start VM (second boot from disk)
  become: true
  community.libvirt.virt:
    name: "{{ libvirt_kvm_name }}"
    state: running
  delegate_to: "{{ libvirt_kvm_target_host }}"

- name: Post-tasks
  ansible.builtin.include_tasks: post_tasks.yml
