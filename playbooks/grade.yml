---
- name: "Lab Verification"
  hosts: localhost
  gather_facts: false
  tasks:
    - name: "Verify solutions are deployed"
      ansible.builtin.stat:
        path: "{{ lookup('env', 'HOME') }}/.hidden/grades/vars"
      register: _grade_vars_dir

    - name: "Fail if solutions not deployed"
      ansible.builtin.fail:
        msg: >-
          Solutions non déployées.
          Lancez 'grade check' pour diagnostiquer l'environnement.
      when: not _grade_vars_dir.stat.exists

    - name: "Find grade vars file"
      ansible.builtin.find:
        paths: "{{ lookup('env', 'HOME') }}/.hidden/grades/vars/"
        patterns: "{{ grade_lab }}.yml"
      register: _grade_found

    - name: "Fail if no grade file found"
      ansible.builtin.fail:
        msg: "No grade file found for '{{ grade_lab }}' in ~/.hidden/grades/vars/"
      when: _grade_found.files | length == 0

    - name: "Grade lab"
      ansible.builtin.include_role:
        name: zenika.training.grade
      vars:
        _grade_var_file: "{{ _grade_loop_file }}"
      loop: "{{ _grade_found.files | map(attribute='path') | list }}"
      loop_control:
        loop_var: _grade_loop_file
        label: "{{ _grade_loop_file | basename | regex_replace('\\.yml$', '') }}"
